<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Moderation - Infernal Sun</title>
    <link rel="stylesheet" href="styles.css">
    <script src="admin.js" defer></script>
</head>
<body style="padding: 40px; background-color: #f5f5f5;">

    <!-- ADMIN AUTH MODAL -->
    <div id="auth-modal" class="modal modal--open">
        <div class="modal__content">
            <h2 class="modal__title">Admin Access</h2>
            <p class="modal__subtitle">Enter password to view pending submissions:</p>
            
            <form onsubmit="handleAdminAuth(event)">
                <input type="password" id="admin-password" placeholder="Password" required autocomplete="current-password">
                <p id="admin-error" class="modal__error" style="display: none; color: #e74c3c; margin-top: 10px;"></p>
                <button type="submit" id="admin-login-btn" class="modal__btn click" style="margin-top: 15px;">Login</button>
            </form>
        </div>
    </div>

    <!-- MAIN ADMIN DASHBOARD -->
    <div id="admin-dashboard" style="display: none; max-width: 1000px; margin: 0 auto;">
        <h1 style="margin-bottom: 30px; font-size: 2rem; color: #2c3e50;">Admin Moderation Panel</h1>

        <!-- PENDING SUBMISSIONS SECTION -->
        <section class="admin-section">
            <h2>Pending Submissions</h2>
            <div id="pending-submissions" class="admin-grid">
                <!-- Pending items render here -->
            </div>
        </section>

        <!-- APPROVED SUBMISSIONS SECTION -->
        <section class="admin-section" style="margin-top: 40px;">
            <h2>Approved Submissions (Manage Live Gallery)</h2>
            <div id="approved-submissions" class="admin-grid">
                <!-- Approved items render here -->
            </div>
        </section>
    </div>

</body>
</html>
