<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Gallery - Infernal Sun</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: rgb(245, 245, 245); padding: 40px 20px;">

  <!-- Simple Header Container -->
  <div style="text-align: center; max-width: 1200px; margin: 0 auto 30px auto;">
    <h1 id="gallery-title" style="color: #2c3e50; font-size: 2.2rem; font-weight: bold; margin-bottom: 12px; display: block;">
      Full Submissions Gallery
    </h1>
    <div>
      <a href="index.html" class="orange" style="font-size: 1.05rem; text-decoration: none; font-weight: bold;">
        &larr; Back to Main Page
      </a>
    </div>
  </div>

  <main style="max-width: 1200px; margin: 0 auto; padding-bottom: 40px;">
    <div id="full-gallery-container"></div>
  </main>

  <!-- GLOBAL LIGHTBOX MODAL -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" class="lightbox__img" src="" alt="Enlarged View">
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const category = urlParams.get('category') || 'gallery';

      const categoryNames = {
        'gallery': 'General Gallery',
        'bounty-board': 'Bounty Board',
        'pets': 'Pets Showcase',
        'misc': 'Miscellaneous'
      };

      const displayName = categoryNames[category] || (category.charAt(0).toUpperCase() + category.slice(1));

      const titleElem = document.getElementById("gallery-title");
      if (titleElem) {
        titleElem.textContent = `${displayName} - All Submissions`;
      }

      loadFullGallery(category, 'full-gallery-container');
    });
  </script>
</body>
</html>
