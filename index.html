<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infernal Sun</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <canvas id="flameCanvas"></canvas>

    <header>
        <container class="nav__container animate-container">
            <div class="row slide-right">
                <div class="header__logo">
                    <img src="assets/images/infernal-sun-icon.png" class="header__logo--img" alt="Team Name Icon">
                </div>

                <div class="nav">
                    <ul class="header__nav">
                        <li class="header__link">
                            <a href="#about">About</a>
                        </li>

                        <li class="header__link">
                            <a href="#gallery">Gallery</a>
                        </li>

                        <li class="header__link">
                            <a href="#more-info">More Info</a>
                        </li>

                        <li class="header__link">
                            <a href="#pets">Pets</a>
                        </li>
                    </ul>
                </div>
            </div>
        </container>
    </header>

    <main>
        <div id="about" class="container">
            <div class="row">
                <div class="about__image">
                    <h1 class="about__container--title">Welcome to Infernal Sun!</h1>
                    <h2 class="about__container--description">The <span class="crossout">official</span> unofficial site to view all of the artwork/talent of the Infernal Sun Team!</h2>
                    <img src="assets/images/banner-image.png" class="about__container--img" alt="Main Banner Image">
                </div>
            </div>
        </div>

        <div id="gallery" class="container">
            <div class="row">
                <div class="gallery__container">
                    <h2 class="gallery__container--title">Gallery</h2>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
